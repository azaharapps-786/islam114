name: islam114
description: A new Flutter project for Islam114.
publish_to: 'none'

version: 1.0.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  share_plus: ^7.0.1

  # BLoC Dependencies
  bloc: ^8.1.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # State Management
  provider: ^6.1.1

  # Shared Preferences for local storage (settings, etc.)
  shared_preferences: ^2.2.2

  # URL Launcher for Play Store
  url_launcher: ^6.2.1

  # Haptic Feedback
  haptic_feedback: ^0.4.0

  # SVG Images
  flutter_svg: ^2.0.9

  vector_math: ^2.1.4

  flutter_launcher_icons: "^0.13.1"

  # For the custom fonts
  google_fonts: ^6.1.0

  # App Information
  package_info_plus: ^4.2.0

  # Audio Player for Tasbeeh sound and Azan
  audioplayers: ^5.2.1

  rxdart: ^0.27.7

  # Date formatting for Tasbeeh history and prayer times
  intl: ^0.18.1

  # Path Provider for accessing local files
  path_provider: ^2.1.1

  # Location services for Namaz Times
  geolocator: ^12.0.0
  geocoding: ^2.1.1

  # HTTP requests for API calls
  http: ^1.1.0

  # Islamic Calendar dependencies
  hijri: ^3.0.0
  table_calendar: ^3.0.9

  # Compass for Qibla direction
  sensors_plus: ^5.0.1
  permission_handler: ^11.3.1

  # --- ADDED DEPENDENCIES ---
  lottie: ^2.7.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/animations/ # <-- ADDED ASSET PATH
    - assets/audio/azan.mp3
    - assets/dictionaries/quran_dictionary_english.json
    - assets/dictionaries/quran_dictionary_assamese.json
    - assets/data/sahih_al_bukhari.json
    - assets/data/surah_list_english.json
    - assets/data/surah_list_assamese.json
    - assets/data/surah_list_bengali.json
    - assets/data/surah_list_hindi.json
    - assets/data/surah_list_arabic.json
    - assets/data/surah_list_english_tafseer.json
    - assets/data/surah_list_assamese_tafseer.json
    - assets/data/surah_list_hindi_tafseer.json
    - assets/data/surah_list_arabic_tafseer.json
    - assets/data/surah_list_bengali_tafseer.json
    - assets/data/quran_arabic.json
    - assets/data/quran_assamese.json
    - assets/data/quran_hindi.json
    - assets/data/quran_english.json
    - assets/data/quran_assamese_tafseer.json
    - assets/data/quran_english_tafseer.json
    - assets/data/quran_arabic_tafseer.json
    - assets/data/quran_bengali_tafseer.json
    - assets/data/quran_bengali.json
    - assets/data/quran_bangla_tafseer.json
    - assets/data/quran_bangla.json
    - assets/data/quran_hindi_tafseer.json

  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver16.otf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"