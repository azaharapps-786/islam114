name: islam114
description: A new Flutter project for Islam114.
publish_to: 'none'

version: 1.0.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  provider: ^6.1.1

  # Shared Preferences for local storage (settings, etc.)
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.1.0

  # URL Launcher for Play Store
  url_launcher: ^6.2.1

  # Haptic Feedback
  haptic_feedback: ^0.4.0

  # SVG Images
  flutter_svg: ^2.0.9

  flutter_launcher_icons: "^0.13.1" # Use the latest version

  # For the custom fonts
  google_fonts: ^6.1.0

  # App Information
  package_info_plus: ^4.2.0

  # Audio Player for Tasbeeh sound and Azan
  audioplayers: ^5.2.1

  # Date formatting for Tasbeeh history and prayer times
  intl: ^0.18.1

  # Path Provider for accessing local files
  path_provider: ^2.1.1

  # Location services for Namaz Times
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # HTTP requests for API calls
  http: ^1.1.0

  # Islamic Calendar dependencies
  hijri: ^3.0.0
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Add your custom assets and fonts here
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/  # For Tasbeeh sound files
    - assets/audio/azan.mp3   # For Azan sound files
    - assets/dictionaries/quran_dictionary_english.json  # Quran Dictionary English
    - assets/dictionaries/quran_dictionary_assamese.json # Quran Dictionary Assamese
    - assets/data/sahih_al_bukhari.json

  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver16.otf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

# ===================================================================
# ADDED THIS SECTION FOR APP ICON
# ===================================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png" # The path to your icon file

  # Optional: For modern Android adaptive icons
  # It's good practice to include this. It uses your icon as the main logo.
  # You can change the background color to match your app's theme.
  adaptive_icon_background: "#FFFFFF" # A white background
  adaptive_icon_foreground: "assets/icons/icon.png" # Your logo on top